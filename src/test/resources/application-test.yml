spring:
  datasource:
    url: jdbc:h2:mem:taskq;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=SET TIME ZONE 'UTC'
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: none

task:
  lease:
    ttl-seconds: 30
  max-attempts:
    default: 3
    upper-bound: 10
